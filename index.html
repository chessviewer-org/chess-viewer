<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="/src/boot/theme-init.js"></script>
    <script src="/src/boot/route-guard.js"></script>
    <meta name="author" content="ChessViewer" />
    <meta
      name="google-site-verification"
      content="JOQDA_IVktrTpKqQ6hedH3jk7ixrSYA_WZMT5QLSOOU"
    />

    <meta
      name="description"
      content="Free chess diagram generator — convert FEN to PNG, JPEG, or SVG in seconds. Professional-quality chess diagrams for books, articles, and social media. No sign-up required."
    />
    <meta property="og:locale" content="en_US" />
    <meta name="twitter:site" content="@chessvision_org" />

    <link
      rel="preload"
      href="/fonts/inter/inter-latin-wght-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />

    <!-- Favicons and Icons -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />

    <!-- Theme Color -->
    <meta name="theme-color" content="#111827" />

    <style>
      html {
        background-color: rgb(15 15 20);
      }
      html[data-theme='light'] {
        background-color: rgb(248 249 252);
      }
      body {
        margin: 0;
        min-height: 100vh;
        background-color: rgb(15 15 20);
        background-image: linear-gradient(135deg, rgb(18 18 24), rgb(12 12 16));
        background-attachment: fixed;
      }
      html[data-theme='light'] body {
        background-color: rgb(248 249 252);
        background-image: linear-gradient(
          135deg,
          rgb(250 251 254),
          rgb(243 244 248)
        );
      }

      html.prerender-stale #main-content {
        visibility: hidden;
      }
      html.prerender-restored #root {
        display: none;
      }
    </style>

    <title>ChessViewer • Free Chess Diagram Generator</title>
  </head>
  <body>
    <div id="root"></div>
    <!-- prerender:strip:start -->
    <style>
      #app-loader {
        position: fixed;
        inset: 0;
        display: none;
        place-items: center;
        pointer-events: none;
      }
      #root:empty ~ #app-loader {
        display: grid;
        animation: app-loader-in 0.2s ease 0.25s both;
      }
      #app-loader > div {
        width: 2.85rem;
        height: 4rem;
        mask: url('/src/assets/logo/Logo.svg') center / contain no-repeat;
        background: linear-gradient(
            rgb(169 132 52) 48%,
            rgb(169 132 52 / 0.18) 52%
          )
          0 100% / 100% 200%;
        animation: app-loader-fill 1.4s cubic-bezier(0.65, 0, 0.35, 1) infinite;
      }
      @keyframes app-loader-in {
        from {
          opacity: 0;
        }
      }
      @keyframes app-loader-fill {
        75%,
        to {
          background-position-y: 0;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #app-loader > div {
          animation: none;
          background-position-y: 0;
        }
      }
    </style>
    <div id="app-loader" role="status" aria-label="Loading ChessViewer">
      <div></div>
    </div>
    <!-- prerender:strip:end -->

    <script type="module" src="/src/index.tsx"></script>
    <script src="/src/boot/retire-service-worker.js"></script>
  </body>
</html>
